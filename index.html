<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Kiran Jala | Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#eef1f8; --card:#ffffff; --ink:#1a2233; --ink-soft:#5b6579;
    --blue-1:#2563eb; --blue-2:#1e3a8a; --amber:#f5a623; --line:#e2e6f0;
    --btn:#3b6fe0; --btn-hover:#2c4fb0; --font-display:'Poppins', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
  }
  [data-theme="dark"]{
    --page:#0b1120; --card:#141c30; --ink:#e7ecf7; --ink-soft:#94a0ba;
    --blue-1:#3b6fe0; --blue-2:#0f1c3f; --amber:#f5c04a; --line:#22304d;
    --btn:#2c4fb0; --btn-hover:#3b6fe0;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; font-family:var(--font-body); background:var(--page); color:var(--ink);
    min-height:100%; padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  header{
    background:linear-gradient(135deg, var(--blue-1), var(--blue-2));
    padding:calc(48px + env(safe-area-inset-top,0px)) 32px 44px; text-align:center; position:relative;
    box-shadow:0 6px 24px rgba(10,20,60,.18);
  }
  .eyebrow{font-size:14px; color:#cfdcff; margin:0 0 8px; font-weight:500;}
  h1{
    font-family:var(--font-display); font-weight:700; font-size:clamp(30px,5vw,44px);
    margin:0 0 10px; color:#fff; letter-spacing:.01em;
  }
  header p.role{
    font-size:15.5px; color:#dbe4ff; margin:0 auto; max-width:600px; line-height:1.55;
  }
  .toggle-btn{
    position:absolute; right:28px; top:calc(28px + env(safe-area-inset-top,0px));
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.4);
    color:#fff; padding:8px 16px; border-radius:999px; cursor:pointer; font-size:12.5px;
    font-family:var(--font-body); font-weight:500;
  }
  .toggle-btn:hover{background:rgba(255,255,255,.22);}
  main{max-width:1080px; margin:-30px auto 0; display:flex; gap:26px; padding:0 28px 90px; align-items:flex-start; position:relative;}
  nav{width:220px; flex-shrink:0; display:flex; flex-direction:column; gap:10px;}
  nav button{
    background:var(--btn); border:none; text-align:left; font-family:var(--font-body); font-weight:500;
    font-size:14.5px; color:#fff; padding:13px 18px; border-radius:12px; cursor:pointer;
    box-shadow:0 3px 10px rgba(30,58,138,.18); transition:background .15s ease, transform .1s ease;
  }
  nav button:hover{background:var(--btn-hover);}
  nav button.active{background:linear-gradient(135deg, var(--blue-2), var(--btn-hover)); box-shadow:0 4px 14px rgba(30,58,138,.32);}
  .card{
    flex:1; min-width:0; background:var(--card); border-radius:18px; padding:36px 40px;
    box-shadow:0 10px 34px rgba(20,30,70,.10); border:1px solid var(--line);
  }
  .card h2{
    font-family:var(--font-display); font-weight:600; font-size:25px; margin:0 0 20px;
    padding-bottom:14px; border-bottom:3px solid var(--amber); display:inline-block;
  }
  .card p{line-height:1.65; color:var(--ink-soft); max-width:660px;}
  .card ul{padding-left:20px; margin:0;}
  .card li{line-height:1.65; color:var(--ink-soft); margin-bottom:10px; max-width:660px;}
  .card li strong, .card p strong{color:var(--ink); font-weight:600;}
  a{color:var(--blue-1); font-weight:600; text-decoration:none;}
  a:hover{text-decoration:underline;}
  .role-block{margin-bottom:28px; padding-bottom:24px; border-bottom:1px solid var(--line);}
  .role-block:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .role-head{display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:10px;}
  .role-title{font-family:var(--font-display); font-size:17.5px; font-weight:600; color:var(--ink);}
  .role-dates{font-size:12.5px; color:#fff; background:var(--blue-1); padding:3px 10px; border-radius:999px; white-space:nowrap; font-family:var(--font-body); font-weight:500;}
  .edu-block{margin-bottom:22px;}
  .edu-title{font-family:var(--font-display); font-weight:600; font-size:17px; margin-bottom:4px;}
  .edu-sub{color:var(--ink-soft); font-size:14px;}
  .skill-row{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; margin-bottom:8px; background:var(--page); border-radius:10px; max-width:560px;}
  .dash-block{margin-bottom:36px;}
  .dash-title{font-family:var(--font-display); font-weight:600; font-size:17px; margin-bottom:12px;}
  .dash-frame{width:100%; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#fff;}
  .readme-box{margin-top:10px; border-radius:12px; overflow:hidden; border:1px solid var(--line);}
  .contact-grid{display:grid; grid-template-columns:100px 1fr; gap:14px 16px; max-width:480px;}
  .contact-grid dt{color:var(--ink-soft); font-size:13px; font-weight:500;}
  .contact-grid dd{margin:0;}
  .download-btn{
    position:fixed; bottom:24px; right:24px; background:linear-gradient(135deg, var(--amber), #ef8a1f);
    color:#fff; padding:14px 24px; border-radius:999px; text-decoration:none; font-weight:600; font-size:14px;
    box-shadow:0 10px 26px rgba(245,166,35,.4);
  }
  .download-btn:hover{filter:brightness(1.05);}
  @media(max-width:760px){
    main{flex-direction:column; margin-top:-18px; padding:0 18px 80px;}
    nav{width:100%; flex-direction:row; flex-wrap:wrap;}
    nav button{flex:1 1 auto; text-align:center; padding:11px 12px; font-size:13px;}
    .card{padding:26px 22px; border-radius:14px;}
    .toggle-btn{top:20px; right:20px;}
    header{padding:44px 20px 40px;}
  }
</style>
</head>
<body>

for (const [key, label] of Object.entries({
  summary:'Summary', education:'Education', experience:'Experience', skills:'Skills',
  projects:'Projects & Training', dashboards:'Dashboards', certifications:'Certifications',
  achievements:'Achievements', languages:'Languages', contact:'Contact'
})) {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.onclick = () => showSection(key, btn);
  menu.appendChild(btn);
}

function showSection(key, btn){
  content.innerHTML = sections[key];
  [...menu.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleTheme(){
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

showSection('summary', menu.firstChild);

</body>
</html>
